envSchema:
  # ---------------------------------------------------------------------------
  # Local-optimized schema (packaged as the "-local" variant).
  # Ports are published on the host; sensible localhost defaults keep local
  # deployment low-friction. Secrets still have no default and are masked.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Common
  # ---------------------------------------------------------------------------
  - name: IMAGE_BASE_PATH
    label: Image Registry Base Path
    description: "Base path of the container registry from which all Gaeco service images are pulled."
    type: text
    required: true
    default: ghcr.io/gaeco-ekkodale

  - name: ASPNETCORE_ENVIRONMENT
    label: ASP.NET Core Environment
    description: "Runtime environment for the .NET backend."
    type: text
    required: true
    default: Development

  - name: OTLP_ENDPOINT
    label: OpenTelemetry OTLP Endpoint
    description: "Endpoint where telemetry data is exported."
    type: text
    required: true
    default: http://gaeco-monitor-aspire:18889

  # ---------------------------------------------------------------------------
  # Host Port Bindings (local only)
  # ---------------------------------------------------------------------------
  - name: ACCESS_POSTGRES_OUTERPORT
    label: Access Postgres Host Port
    description: "Host port published for the Access Service PostgreSQL instance."
    type: text
    required: true
    default: 5433

  - name: ACCESS_SERVER_OUTERPORT
    label: Access Server Host Port
    description: "Host port published for the Access Service server."
    type: text
    required: true
    default: 5131

  - name: ACCESS_CLIENT_OUTERPORT
    label: Access Client Host Port
    description: "Host port published for the Access Service client (micro-frontend)."
    type: text
    required: true
    default: 3132

  # ---------------------------------------------------------------------------
  # External Service Hostnames (local: localhost:port)
  # ---------------------------------------------------------------------------
  - name: GUIDELINE_SERVER_HOSTNAME
    label: Guideline Server Hostname
    description: "Hostname (and optional port) used to reach the Guideline service."
    type: text
    required: true
    default: localhost:5008

  - name: USECASE_SERVER_HOSTNAME
    label: UseCase Server Hostname
    description: "Hostname (and optional port) used to reach the UseCase service."
    type: text
    required: true
    default: localhost:5130

  # ---------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------
  - name: KEYCLOAK_REALM
    label: Keycloak Realm
    description: "Keycloak realm used for authentication."
    type: text
    required: true
    default: gaeco

  - name: KEYCLOAK_CLIENT_ID
    label: Keycloak Client ID
    description: "Keycloak realm client shared by this module's server and client. The frontend reads its roles from resource_access under this id."
    type: text
    required: true
    default: app-access

  - name: KEYCLOAK_CLIENT_SECRET
    label: Keycloak Client Secret
    description: "Client secret of KEYCLOAK_CLIENT_ID, used by the backend service account."
    type: password
    required: true
    default: xA2rd7bsPMZVGZhRo9CZhZ0KaUuLh5Ux

  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------
  - name: KAFKA_ADDRESS
    label: Kafka Address
    description: "Kafka bootstrap server address (network alias on gaeco-network)."
    type: text
    required: true
    default: gaeco-broker:29092

  - name: KAFKA_CONSUMER_GROUP_ACCESS
    label: Kafka Consumer Group (Access Service)
    description: "Kafka consumer group ID for the Access Service."
    type: text
    required: true
    default: accessrights-service-group

  - name: KAFKA_AUTO_OFFSET_RESET
    label: Kafka Auto Offset Reset
    description: "Consumer offset reset policy when no initial offset exists."
    type: text
    required: true
    default: Earliest

  - name: KAFKA_SESSION_TIMEOUT_MS
    label: Kafka Session Timeout (ms)
    description: "Timeout in milliseconds used to detect consumer failures."
    type: text
    required: true
    default: 150000

  - name: KAFKA_MAX_POLL_INTERVAL_MS
    label: Kafka Max Poll Interval (ms)
    description: "Maximum allowed delay between consumer poll calls in milliseconds."
    type: text
    required: true
    default: 1500000

  - name: KAFKA_TOPICS_ACCESSRIGHTS
    label: Kafka Topic (Access Rights)
    description: "Kafka topic for access rights events."
    type: text
    required: true
    default: ekkodale.gaeco.access.public.accessrights

  - name: KAFKA_TOPICS_USERGROUPS
    label: Kafka Topic (User Groups)
    description: "Kafka topic for user group events."
    type: text
    required: true
    default: ekkodale.gaeco.access.public.userGroups

  - name: KAFKA_TOPICS_GUIDELINES
    label: Kafka Topic (Guidelines)
    description: "Kafka topic for guideline upload events."
    type: text
    required: true
    default: ekkodale.gaeco.guideline.public.uploaded

  - name: KAFKA_TOPICS_USECASEGUIDELINES
    label: Kafka Topic (UseCase Guidelines)
    description: "Kafka topic for UseCase-Guideline upload events published by the Access Service."
    type: text
    required: true
    default: ekkodale.gaeco.access.public.usecaseGuidelines

  # ---------------------------------------------------------------------------
  # Minio (Object Storage)
  # ---------------------------------------------------------------------------
  - name: MINIO_ADDRESS
    label: Minio Address
    description: "Address of the Minio instance (network alias on gaeco-network)."
    type: text
    required: true
    default: gaeco-minio:9000

  - name: MINIO_ROOT_USER
    label: Minio Root User
    description: "Root user / access key for Minio."
    type: text
    required: true
    default: minioadmin

  - name: MINIO_ROOT_PASSWORD
    label: Minio Root Password
    description: "Root password / secret key for Minio."
    type: password
    required: true
    default: minioadmin

  - name: MINIO_USECASEGUIDELINE_BUCKET
    label: Minio UseCase-Guideline Bucket
    description: "Minio bucket where UseCase-Guidelines are uploaded."
    type: text
    required: true
    default: usecaseguideline

  # ---------------------------------------------------------------------------
  # Access Service
  # ---------------------------------------------------------------------------
  - name: ACCESS_SERVER_HOSTNAME
    label: Access Server Hostname
    description: "Hostname (and port) under which the Access Service server is reachable from the browser."
    type: text
    required: true
    default: localhost:5131

  - name: ACCESS_POSTGRES_USER
    label: Access Postgres User
    description: "Database user for the Access Service PostgreSQL instance."
    type: text
    required: true
    default: accessservice

  - name: ACCESS_POSTGRES_PASSWORD
    label: Access Postgres Password
    description: "Database password for the Access Service PostgreSQL instance."
    type: password
    required: true
    default: access-local-pw

  - name: ACCESS_POSTGRES_DATABASE
    label: Access Postgres Database
    description: "Database name for the Access Service PostgreSQL instance."
    type: text
    required: true
    default: accessdb


  - name: ADMIN_ROLE_NAME
    label: Admin Role Name
    description: "Keycloak client role name that grants admin access in the frontend."
    type: text
    required: true
    default: admin

  - name: MOUNT_ROUTE
    label: Microfrontend Mount Route
    description: "Base path where the micro-frontend will be mounted in the host application."
    type: text
    required: true
    default: /access
